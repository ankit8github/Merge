[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "setuptools==84.2.1", "wheel==0.48.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["database: requires explicitly configured local merge_dev PostgreSQL"]
