{
  "name": "Merge offline and PostgreSQL acceptance",
  "on": {"push": {}, "pull_request": {}, "workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "offline": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}},
        {"uses": "actions/setup-node@v4", "with": {"node-version": "22.15.0", "cache": "npm", "cache-dependency-path": "frontend/package-lock.json"}},
        {"run": "python -m pip install -r backend/requirements.lock"},
        {"run": "python -m pytest -q -m 'not database' --tb=short", "working-directory": "backend"},
        {"run": "node --check load/board.js"},
        {"run": "npm ci", "working-directory": "frontend"},
        {"run": "npm test -- --reporter=dot --maxWorkers=1", "working-directory": "frontend"},
        {"run": "npm run build", "working-directory": "frontend"},
        {"run": "git diff --check"}
      ]
    },
    "postgres": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "strategy": {"fail-fast": false, "matrix": {"revision": ["0003_auth", "0004_admission", "0005_invitations", "0006_profiles"]}},
      "services": {
        "postgres": {
          "image": "postgres:16",
          "env": {"POSTGRES_PASSWORD": "${{ github.run_id }}-${{ github.run_attempt }}"},
          "ports": ["127.0.0.1:5432:5432"],
          "options": "--health-cmd 'pg_isready -U postgres -d postgres' --health-interval 5s --health-timeout 5s --health-retries 10"
        }
      },
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}},
        {"run": "python -m pip install -r backend/requirements.lock"},
        {"name": "Guarded migrations and required authenticated suites", "working-directory": "backend", "env": {"CI_ADMIN_PASSWORD": "${{ github.run_id }}-${{ github.run_attempt }}"}, "run": "set -euo pipefail\nPG_PID=$(docker inspect --format '{{.State.Pid}}' '${{ job.services.postgres.id }}')\nPYTHON=$(command -v python)\nsudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,CI_ADMIN_PASSWORD nsenter --target \"$PG_PID\" --net \"$PYTHON\" -m release_support.ci --confirm-ephemeral-postgres --revision '${{ matrix.revision }}'"},
        {"name": "Preserve sanitized receipts", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "acceptance-${{ matrix.revision }}-${{ github.run_attempt }}", "path": "backend/test-results/release/*.json\nbackend/test-results/guarded/run-*.json", "if-no-files-found": "error", "retention-days": 14}}
      ]
    }
  }
}
